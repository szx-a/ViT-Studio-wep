<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViT 图像识别中台</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body>

<header>
  <h1>🔬 ViT 图像识别中台</h1>
  <p class="subtitle">Vision Transformer · RTX 5060 · fp16 · 多模型切换</p>
</header>

<nav>
  <button class="tab-btn active" data-tab="predict">🖼️ 图片识别</button>
  <button class="tab-btn" data-tab="dataset">📦 数据集</button>
  <button class="tab-btn" data-tab="train">🏋️ 训练中心</button>
  <button class="tab-btn" data-tab="models">🧠 模型管理</button>
</nav>

<!-- ==================== Tab 1: 图片识别 ==================== -->
<section id="tab-predict" class="tab-content active">
  <div class="card">
    <h2>上传图片</h2>
    <div class="row">
      <label>识别模型
        <select id="modelMode" style="margin-left:4px;padding:6px">
          <option value="imagenet">通用识别（ImageNet-1K）</option>
          <option value="custom">自定义识别（微调模型）</option>
        </select>
      </label>
      <label id="customModelWrap" class="hidden">微调模型
        <select id="customModelSelect" style="margin-left:4px;padding:6px;min-width:160px"></select>
      </label>
    </div>
    <div class="upload-zone" id="uploadZone">
      <p>📁 拖拽图片到此处 或 点击选择</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    <div id="previewBox" class="hidden">
      <img id="previewImg" src="" alt="预览">
    </div>
    <div class="row">
      <label>Top-K <input type="number" id="topK" value="5" min="1" max="20" style="width:60px"></label>
      <button id="btnPredict" class="btn-primary" disabled>🔍 识别</button>
    </div>
    <div id="predictProgress" class="progress-bar hidden">
      <div id="predictProgressFill" class="progress-fill-indeterminate"></div>
    </div>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>识别结果</h2>
    <div id="resultList"></div>
    <canvas id="resultChart" height="200"></canvas>
  </div>
</section>

<!-- ==================== Tab 2: 数据集 ==================== -->
<section id="tab-dataset" class="tab-content">
  <div class="card">
    <h2>数据集管理</h2>
    <div class="row">
      <label>数据集
        <select id="datasetSelect" style="margin-left:4px;padding:6px;min-width:140px"></select>
      </label>
      <input type="text" id="newCategory" placeholder="新类别名">
      <button id="btnCreateCategory" class="btn-primary">➕ 创建类别</button>
      <input type="file" id="datasetFileInput" accept="image/*" multiple hidden>
      <button id="btnUploadTrigger" class="btn-secondary">📤 上传图片</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label>类别
        <select id="categorySelect" style="margin-left:4px;padding:6px;min-width:180px"></select>
      </label>
      <span id="datasetMsg" style="margin-left:12px;color:#4caf50"></span>
    </div>
  </div>

  <div class="card">
    <h2>图片列表</h2>
    <div id="imageGrid" class="image-grid">请先选择数据集和类别</div>
  </div>
</section>

<!-- ==================== Tab 3: 训练中心 ==================== -->
<section id="tab-train" class="tab-content">
  <div class="card">
    <h2>训练配置</h2>
    <div class="form-grid">
      <label>数据集 <select id="trainDataset"></select></label>
      <label>Epochs <input type="number" id="trainEpochs" value="10" min="1"></label>
      <label>Batch <input type="number" id="trainBatch" value="32" min="1"></label>
      <label>学习率 <input type="number" id="trainLR" value="0.0001" step="0.0001"></label>
      <label class="checkbox-label">
        <input type="checkbox" id="trainFreeze" checked> 冻结 Backbone
      </label>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="btnStartTrain" class="btn-primary">🚀 开始训练</button>
      <button id="btnStopTrain" class="btn-danger">⏹️ 停止</button>
    </div>
  </div>

  <div class="card">
    <h2>训练进度 <span id="trainStatus">— 空闲</span></h2>
    <div style="margin-bottom:4px;font-size:12px;color:#888">Epoch 进度</div>
    <div class="progress-bar"><div id="progressFill"></div></div>
    <div id="batchProgressLabel" style="margin-top:4px;font-size:12px;color:#888;display:none">Batch 进度</div>
    <div class="progress-bar" id="batchProgressBar" style="display:none">
      <div id="batchProgressFill"></div>
    </div>
    <p id="trainMessage">等待开始训练...</p>
    <div class="charts-row">
      <div class="chart-box"><canvas id="lossChart"></canvas></div>
      <div class="chart-box"><canvas id="accChart"></canvas></div>
    </div>
  </div>

  <div id="trainPending" class="card hidden">
    <h2>✅ 训练完成，请选择处理方式</h2>
    <p id="pendingInfo" style="margin-bottom:12px;color:#aaa"></p>
    <div class="row">
      <button id="btnKeepModel" class="btn-primary">💾 保留并命名</button>
      <button id="btnDeleteModel" class="btn-danger">🗑️ 删除模型</button>
      <button id="btnTestModel" class="btn-secondary">🧪 测试评分</button>
    </div>
  </div>
</section>

<!-- ==================== Tab 4: 模型管理 ==================== -->
<section id="tab-models" class="tab-content">
  <div class="card">
    <h2>模型列表</h2>
    <div id="modelList">加载中...</div>
  </div>

  <div class="card">
    <h2>模型评分</h2>
    <div class="form-grid">
      <label>模型 <select id="evalModel"></select></label>
      <label>数据集 <select id="evalDataset"></select></label>
      <label>Batch <input type="number" id="evalBatch" value="32" min="1"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnEval" class="btn-primary">🧪 开始评分</button>
    </div>
    <div id="evalProgress" class="progress-bar hidden">
      <div id="evalProgressFill"></div>
    </div>
    <p id="evalProgressText" style="font-size:13px;color:#999;margin:4px 0"></p>
    <div id="evalResult"></div>
  </div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
